services:
  capcut-mate:
    image: gogoshine/capcut-mate:latest
    platform: linux/amd64
    ports:
      - "30000:30000"
    volumes:
      - ./html/output:/app/output
      - ./logs:/app/logs
    environment:
      # 宿主机 HTTP 端口。nginx 的 ports、DRAFT_URL、DOWNLOAD_URL 都从 HOST_HTTP_PORT 生成，只改这一处。
      # 默认 80（可写在项目目录 .env）。80 被占用时改为 81 后重新 up，下载地址会带上 :81。
      # 不要只改 ports 映射：DRAFT_URL / DOWNLOAD_URL 仍指向 80 时，Windows 客户端无法下载草稿。
      # 映射到 81 的等价手写示例：
      #   ports: ["81:80"]
      #   DRAFT_URL=http://127.0.0.1:81/openapi/capcut-mate/v1/get_draft
      #   DOWNLOAD_URL=http://127.0.0.1:81/
      - "HOST_HTTP_PORT=${HOST_HTTP_PORT:-80}"
      # 草稿下载 URL。默认端口 80 时与旧值 http://127.0.0.1/openapi/... 相同（应用会省略 :80）。
      - "DRAFT_URL=http://127.0.0.1:${HOST_HTTP_PORT:-80}/openapi/capcut-mate/v1/get_draft"
      # 用于将容器内部的文件路径转成 URL，本质是将 /app/ 替换成 DOWNLOAD_URL 得到下载路径。
      # 必须包含宿主机端口，否则素材仍从 80 端口下载。
      - "DOWNLOAD_URL=http://127.0.0.1:${HOST_HTTP_PORT:-80}/"
      # 草稿提示URL
      - TIP_URL=https://docs.jcaigc.cn
      # 文件下载大小限制（字节），默认200MB（209715200）
      - DOWNLOAD_FILE_SIZE_LIMIT=209715200
      # 草稿清理策略（本模块内定义；保留数量可由环境变量 DRAFT_CLEANUP_MAX_DRAFT_COUNT 覆盖，默认 1000）
      - DRAFT_CLEANUP_MAX_DRAFT_COUNT=6000
      # 远程媒体 URL 直写模式：false=下载到本地（默认）；true=草稿仅写入 URL，不下载
      - USE_REMOTE_MEDIA_URL=false
    networks:
      - capcut-mate-network
    mem_limit: 1G
    memswap_limit: 1G
    cpus: '1' 
    oom_score_adj: -500
    restart: unless-stopped
    container_name: capcut-mate
  
  nginx: # nginx服务器
    image: gogoshine/nginx:latest
    platform: linux/amd64
    ports:
      # 与上面的 HOST_HTTP_PORT 保持一致。改映射端口时同步该变量，不要单独写成 "81:80" 却留下 :80 的下载地址。
      - "${HOST_HTTP_PORT:-80}:80"
    environment:
      - PROXY_PASS_URL_1=http://capcut-mate:30000/openapi/capcut-mate/
      - PROXY_LOCATION_1=/openapi/capcut-mate/
    volumes:
      - ./html:/usr/share/nginx/html
    networks:
      - capcut-mate-network
    mem_limit: 1G
    memswap_limit: 1G
    cpus: '1.0'
    oom_score_adj: -500
    restart: unless-stopped
    container_name: nginx

networks:
  capcut-mate-network:
    driver: bridge